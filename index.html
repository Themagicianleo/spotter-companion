<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotter's Companion</title>
  <meta name="description" content="A live map of nearby aircraft built on free, open ADS-B data.">
  <!-- Leaflet (map library), stored in vendor/ so the site needs no CDN -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <!-- MapLibre draws the sharp vector maps (OpenFreeMap); the bridge lets Leaflet use it as a layer -->
  <link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Top bar: name, search, status and the buttons that open the panels -->
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2c.8 0 1.3.9 1.3 2v5.2l7.7 4.6v2l-7.7-2.3v4.6l2.2 1.7v1.6L12 20.4l-3.5 1.2V20l2.2-1.7v-4.6L3 16v-2l7.7-4.6V4c0-1.1.5-2 1.3-2z"/></svg>
      <span>Spotter's Companion</span>
    </div>
    <input id="search" class="search" type="search" autocomplete="off"
           placeholder="Search callsign, registration, type or airport" aria-label="Search aircraft">
    <span id="status" class="status">Starting…</span>
    <nav class="topbar__buttons">
      <button type="button" class="tb-btn" id="filters-btn" aria-expanded="false">Filters</button>
      <button type="button" class="tb-btn" data-toggle="list-panel" aria-expanded="false">List</button>
      <button type="button" class="tb-btn" data-toggle="area-panel" aria-expanded="false">Area</button>
    </nav>
  </header>

  <main class="stage">
    <div id="map" class="map" aria-label="Map of nearby aircraft"></div>

    <!-- Error / info messages float over the map instead of leaving it silently blank -->
    <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>

    <!-- Flight card: opens when you click a plane (filled in by js/infoPanel.js) -->
    <section id="info-panel" class="card info" hidden aria-label="Aircraft info"></section>

    <!-- Search area (center and radius) -->
    <section id="area-panel" class="card drawer drawer--small" hidden aria-label="Search area">
      <h2>Search area</h2>
      <form id="center-form" class="center-form">
        <label>Latitude <input id="center-lat" type="number" step="0.0001" min="-90" max="90" required></label>
        <label>Longitude <input id="center-lon" type="number" step="0.0001" min="-180" max="180" required></label>
        <label>Radius (nm) <input id="radius" type="number" step="1" min="1" max="250" required></label>
        <div class="row">
          <button type="submit" class="primary">Go</button>
          <button type="button" id="use-map-center" title="Search around the middle of the visible map">Use map center</button>
          <button type="button" id="reset-center" title="Back to Singapore">Reset</button>
        </div>
      </form>
    </section>

    <!-- Sortable list of aircraft -->
    <section id="list-panel" class="card drawer" hidden aria-label="Aircraft list">
      <div class="list-toolbar">
        <h2 id="list-count">0 shown</h2>
        <button type="button" id="export-csv">Export CSV</button>
      </div>
      <!-- Filters apply to both the map and the list -->
      <details id="filters-box" class="filters-box">
        <summary>Filters</summary>
        <form id="filters" class="filters" autocomplete="off">
          <label>Type codes
            <input id="filter-types" list="seen-types" placeholder="e.g. A359, B77W">
            <datalist id="seen-types"></datalist>
          </label>
          <label>Callsign / airline prefix
            <input id="filter-prefix" placeholder="e.g. SIA or TGW">
          </label>
          <div class="row">
            <label>Min alt (ft) <input id="filter-min-alt" type="number" step="500" min="0"></label>
            <label>Max alt (ft) <input id="filter-max-alt" type="number" step="500" min="0"></label>
          </div>
          <label class="check"><input id="filter-ground" type="checkbox" checked> Include aircraft on ground</label>
          <label class="check"><input id="show-badges" type="checkbox" checked> Show airline codes on the map</label>
          <button type="reset">Clear filters</button>
        </form>
      </details>
      <div class="list-wrap">
        <table id="aircraft-list" class="aircraft-list"></table>
      </div>
      <p class="credits">
        <span id="provider-credit"></span> ·
        Map © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors
        or satellite <a href="https://s2maps.eu" target="_blank" rel="noopener">Sentinel-2 cloudless by EOX</a> ·
        Routes: <a href="https://github.com/vradarserver/standing-data" target="_blank" rel="noopener">VRS standing data</a> ·
        Data may be incomplete or wrong. Not for navigation.
      </p>
    </section>
  </main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/maplibre-gl/maplibre-gl.js"></script>
  <script src="vendor/maplibre-gl-leaflet/leaflet-maplibre-gl.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
