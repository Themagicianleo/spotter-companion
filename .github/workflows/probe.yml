name: Probe Commons photo dates
on:
  push:
    branches: [probe-metar]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - continue-on-error: true
        run: |
          set +e
          mkdir -p probe
          python3 - > probe/dates.txt 2>&1 <<'PY'
          import json, urllib.request, urllib.parse
          UA = {'User-Agent': 'SkyWatchSG/1.0 (https://github.com/Themagicianleo/spotter-companion; hobby project)'}
          for reg in ['A6-EOW', '9V-SCT', '9V-SJA', '9M-LND']:
              for mode in ['cat', 'search']:
                  p = {'action': 'query', 'format': 'json', 'origin': '*', 'prop': 'imageinfo', 'iiprop': 'url|extmetadata|mime|timestamp',
                       'iiurlwidth': 960, 'iiextmetadatafilter': 'Artist|LicenseShortName|LicenseUrl|DateTimeOriginal|DateTime'}
                  if mode == 'cat': p.update(generator='categorymembers', gcmtitle=f'Category:{reg} (aircraft)', gcmtype='file', gcmlimit=12)
                  else: p.update(generator='search', gsrsearch=f'"{reg}"', gsrnamespace=6, gsrlimit=12)
                  d = json.load(urllib.request.urlopen(urllib.request.Request('https://commons.wikimedia.org/w/api.php?' + urllib.parse.urlencode(p), headers=UA), timeout=30))
                  pages = list((d.get('query') or {}).get('pages', {}).values())
                  print(f'== {reg} {mode}: {len(pages)} files')
                  for pg in pages:
                      ii = pg['imageinfo'][0]; md = ii.get('extmetadata', {})
                      print('  ', pg['title'][:60], '| DateTimeOriginal:', repr(md.get('DateTimeOriginal', {}).get('value'))[:90], '| DateTime:', repr(md.get('DateTime', {}).get('value'))[:40], '| upload:', ii.get('timestamp'))
          PY
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A probe; git commit -m "probe dates"; git push
