name: Probe Light Scout planner live
on:
  push:
    branches: [probe-metar]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Live check in a real browser
        continue-on-error: true
        run: |
          set +e
          mkdir -p probe
          sleep 60   # give GitHub Pages time to publish the new version
          npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
          cat > live.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 390, height: 844 } });
          const errors = []; p.on('pageerror', (e) => errors.push(e.message));
          const net = []; p.on('response', (r) => { const u = r.url(); if (/relay|open-meteo|airports\.json/.test(u)) net.push(r.status() + ' ' + decodeURIComponent(u).slice(0, 140)); });
          await p.goto('https://themagicianleo.github.io/light-scout/?v=' + Date.now());
          await p.waitForSelector('#tabs:not([hidden])', { timeout: 30000 });
          await p.click('#tabPlanner');
          await p.waitForSelector('#plAirportInfo .pl-airport-name', { timeout: 30000 });
          await p.evaluate(() => { localStorage.setItem('ls:planner:positions', JSON.stringify({ WSSS: [{ id: 'a', name: 'Test position', lat: 1.36219, lon: 103.993297 }] })); });
          await p.reload();
          await p.waitForSelector('.pl-pos', { timeout: 30000 });
          await p.waitForFunction(() => /METAR|unavailable/.test(document.querySelector('#plWind')?.textContent || ''), null, { timeout: 30000 }).catch(() => {});
          await p.waitForFunction(() => /Updated|could not load|No aircraft/.test(document.querySelector('#plTraffic')?.textContent || ''), null, { timeout: 40000 }).catch(() => {});
          const text = (id) => p.evaluate((i) => document.getElementById(i)?.innerText ?? '(missing)', id);
          console.log(JSON.stringify({ errors, net, airport: await text('plAirportInfo'), light: (await text('plLight')).slice(0, 600), wind: await text('plWind'), traffic: await text('plTraffic') }, null, 2));
          await p.screenshot({ path: 'probe/live.png', fullPage: true });
          await b.close();
          JS
          node live.mjs > probe/live.json 2>&1
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A probe; git commit -m "live probe output"; git push
