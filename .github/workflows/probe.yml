name: Probe Planespotters photo counts
on:
  push:
    branches: [probe-metar]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count photos per aircraft
        continue-on-error: true
        run: |
          set +e
          mkdir -p probe
          R="https://spotters-relay.maotianze.workers.dev/?url="
          UA="SpottersCompanion/1.0 (+https://github.com/Themagicianleo/spotter-companion)"
          curl -sS -A "$UA" "${R}https%3A%2F%2Fapi.adsb.lol%2Fv2%2Fpoint%2F1.35%2F103.99%2F60" > /tmp/ac.json
          python3 - > probe/photos.txt <<'PY'
          import json, urllib.request, urllib.parse, time
          ac = json.load(open('/tmp/ac.json'))['ac']
          hexes = [a['hex'] for a in ac if a.get('r')][:10] + ['76cd41']
          R = "https://spotters-relay.maotianze.workers.dev/?url="
          for path in ['hex/%s', 'reg/%s']:
              for a in [x for x in ac if x.get('r')][:10]:
                  key = a['hex'] if path.startswith('hex') else a['r']
                  url = 'https://api.planespotters.net/pub/photos/' + path % key
                  try:
                      req = urllib.request.Request(R + urllib.parse.quote(url, safe=''), headers={'User-Agent': 'SpottersCompanion-probe/1.0'})
                      d = json.load(urllib.request.urlopen(req, timeout=20))
                      print(path % key, a.get('r'), a.get('t'), 'photos:', len(d.get('photos', [])), 'keys:', sorted(d.keys()))
                  except Exception as e:
                      print(path % key, 'ERROR', e)
                  time.sleep(1.2)
          PY
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A probe; git commit -m "probe photos"; git push
