# Rebuilds data/aircraft_db/ + data/aircraft_flags.json (tar1090-db + OpenSky + VRS) and data/routes.json
# (Virtual Radar Server standing data), and commits them.
# Runs on GitHub's servers (which can download both databases), monthly, when the build
# script changes, or by hand: Actions tab -> "Build aircraft database" -> "Run workflow".
name: Build aircraft database

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 2 * *" # 03:17 UTC on the 2nd of every month
  push:
    branches: [main]
    paths:
      - scripts/build_aircraft_db.py
      - scripts/build_routes.py
      - data/aircraft_types.json
      - .github/workflows/build-aircraft-db.yml

permissions:
  contents: write # needed to commit the rebuilt files

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the database
        run: python3 scripts/build_aircraft_db.py
      - name: Build the routes file
        run: python3 scripts/build_routes.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aircraft_db data/aircraft_flags.json data/routes.json data/airlines.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Rebuild aircraft database (automated)"
            git push
          fi
