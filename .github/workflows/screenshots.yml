# Takes real screenshots of the app on GitHub's servers (live planes, real map tiles) and pushes
# them to the "screenshots" branch (not main). Run by hand from the Actions tab, or on changes
# to the map code.
name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - js/map.js
      - scripts/screenshot.mjs
      - .github/workflows/screenshots.yml

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Start the app with its local relay
        run: |
          python3 scripts/dev_server.py > server.log 2>&1 &
          sleep 2
      - run: node scripts/screenshot.mjs out
      - name: Push to the screenshots branch
        run: |
          cd out
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Screenshots $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
